<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 580" width="1060" height="580" role="img" aria-label="System Architecture">
  <defs>
    <style>
      .font { font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .title { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .group-label { font-size: 12px; font-weight: 600; fill: #475569; }
      .box-title { font-size: 13.5px; font-weight: 600; fill: #0f172a; }
      .box-sub { font-size: 11.5px; font-weight: 400; fill: #64748b; }
      .mini-title { font-size: 12.5px; font-weight: 600; fill: #1e293b; }
      .mini-sub { font-size: 11px; font-weight: 400; fill: #64748b; }
      .edge { font-size: 11px; font-weight: 500; fill: #475569; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #475569; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1060" height="580" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>

  <!-- Simple Title -->
  <text x="28" y="36" class="font title">System Architecture</text>
  <line x1="28" y1="50" x2="1032" y2="50" stroke="#f1f5f9" stroke-width="1.2"/>

  <!-- ==================== FRONTEND ==================== -->
  <rect x="28" y="68" width="772" height="92" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="44" y="88" class="font group-label">Frontend (Next.js 15 / React 19)</text>

  <!-- Web UI -->
  <rect x="44" y="98" width="310" height="48" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="60" y="119" class="font box-title">Web UI</text>
  <text x="60" y="136" class="font box-sub">SSE 流式对话 · 确认加购卡片 · 反馈与指标</text>

  <!-- Arrow Web UI -> API Routes -->
  <line x1="354" y1="122" x2="462" y2="122" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="408" y="115" text-anchor="middle" class="mono">/api/chat/stream</text>
  <text x="408" y="136" text-anchor="middle" class="mono">/api/feedback</text>

  <!-- Next.js API Routes -->
  <rect x="468" y="98" width="316" height="48" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="484" y="119" class="font box-title">Next.js API Proxy</text>
  <text x="484" y="136" class="font box-sub">会话 Cookie · 参数校验 · 加购前状态复核 (409)</text>

  <!-- Arrow Frontend -> Backend -->
  <line x1="626" y1="160" x2="626" y2="196" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <text x="638" y="183" class="mono">/agent/stream · /carts/* · /products/*</text>

  <!-- ==================== BACKEND ==================== -->
  <rect x="28" y="200" width="772" height="352" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="44" y="222" class="font group-label">Backend Service (FastAPI + LangGraph)</text>

  <!-- LangGraph Box -->
  <rect x="44" y="236" width="490" height="122" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.1"/>
  <text x="58" y="255" class="font group-label" fill="#1e40af">LangGraph Agent (上限 6 步 / 55s)</text>

  <!-- decide -->
  <rect x="58" y="266" width="204" height="78" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="72" y="287" class="font box-title">decide</text>
  <text x="72" y="306" class="font box-sub">原生 Tool Calling</text>
  <text x="72" y="323" class="font box-sub">连接池 · 429/5xx 重试与降级</text>

  <!-- execute -->
  <rect x="316" y="266" width="204" height="78" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="330" y="287" class="font box-title">execute</text>
  <text x="330" y="306" class="font box-sub">工具白名单 &amp; 参数校验</text>
  <text x="330" y="323" class="font box-sub">重复调用拦截 · 防注入</text>

  <!-- Loop arrows -->
  <line x1="262" y1="296" x2="310" y2="296" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="316" y1="318" x2="268" y2="318" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Arrow -> summary -->
  <line x1="534" y1="304" x2="572" y2="304" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- summary -->
  <rect x="578" y="236" width="206" height="122" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.3"/>
  <text x="594" y="262" class="font box-title">summary</text>
  <text x="594" y="284" class="font box-sub">基于工具 JSON 生成中文摘要</text>
  <text x="594" y="303" class="font box-sub">事实卡片直出，不改写价格</text>
  <text x="594" y="322" class="font box-sub">SSE 流式推送进度与结果</text>

  <!-- Arrow execute -> Tools -->
  <line x1="418" y1="358" x2="418" y2="386" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Tools -->
  <rect x="44" y="390" width="740" height="74" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="58" y="408" class="font group-label">Tools (Read-Only &amp; Suggest)</text>

  <rect x="58" y="416" width="166" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="141" y="432" text-anchor="middle" class="font mini-title">商品目录与详情</text>
  <text x="141" y="447" text-anchor="middle" class="font mini-sub">20 SKU 检索与推荐</text>

  <rect x="236" y="416" width="172" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="322" y="432" text-anchor="middle" class="font mini-title">型号适配核验</text>
  <text x="322" y="447" text-anchor="middle" class="font mini-sub">90 天审核快照校验</text>

  <rect x="420" y="416" width="172" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="506" y="432" text-anchor="middle" class="font mini-title">双语知识检索 (RAG)</text>
  <text x="506" y="447" text-anchor="middle" class="font mini-sub">BM25 / BGE + RRF</text>

  <rect x="604" y="416" width="166" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="687" y="432" text-anchor="middle" class="font mini-title">安装 / 排障 / 加购建议</text>
  <text x="687" y="447" text-anchor="middle" class="font mini-sub">只读，写入需人工确认</text>

  <!-- Arrow Tools -> SQLite -->
  <line x1="418" y1="464" x2="418" y2="484" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SQLite -->
  <rect x="44" y="488" width="740" height="48" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="60" y="517" class="font box-title">SQLite</text>
  <text x="136" y="517" class="font box-sub">会话历史与记忆  ·  请求租约  ·  幂等购物车事务  ·  用户反馈与运行指标</text>

  <!-- ==================== MCP (RIGHT SIDE) ==================== -->
  <rect x="826" y="200" width="206" height="264" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.2"/>
  <text x="842" y="222" class="font group-label" fill="#6d28d9">MCP Server</text>

  <!-- MCP Client -->
  <rect x="842" y="246" width="174" height="58" rx="8" fill="#ffffff" stroke="#c084fc" stroke-width="1.2"/>
  <text x="929" y="270" text-anchor="middle" class="font box-title">External MCP Client</text>
  <text x="929" y="289" text-anchor="middle" class="font box-sub">Claude / Cursor 等</text>

  <!-- Arrow Client -> FastMCP -->
  <line x1="929" y1="304" x2="929" y2="384" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="938" y="348" class="mono" fill="#6d28d9">stdio (只读)</text>

  <!-- FastMCP -->
  <rect x="842" y="390" width="174" height="58" rx="8" fill="#ffffff" stroke="#a855f7" stroke-width="1.2"/>
  <text x="929" y="414" text-anchor="middle" class="font box-title">FastMCP</text>
  <text x="929" y="433" text-anchor="middle" class="mono">app.agent.mcp_server</text>

  <!-- Arrow FastMCP -> Tools -->
  <line x1="842" y1="422" x2="790" y2="422" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
</svg>
