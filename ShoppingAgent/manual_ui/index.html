<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shopping Agent MVP Console</title>
    <link rel="stylesheet" href="/ui/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar">
        <div>
          <h1>Shopping Agent MVP Console</h1>
          <p>Manual test UI</p>
        </div>
        <button id="create-cart" type="button">Create Cart</button>
      </section>

      <section class="workspace">
        <div class="panel search-panel">
          <form id="search-form" class="search-form">
            <label for="query">Product search</label>
            <div class="search-row">
              <input id="query" name="query" type="search" value="black hoodie" />
              <button type="submit">Search</button>
            </div>
            <div class="filters">
              <label>
                Category
                <input id="category" name="category" value="apparel" />
              </label>
              <label>
                Market
                <input id="market" name="market" value="us" />
              </label>
              <label>
                Language
                <input id="language" name="language" value="en" />
              </label>
              <label>
                Color
                <input id="color" name="color" value="black" />
              </label>
              <label>
                Size
                <input id="size" name="size" placeholder="m" />
              </label>
              <label>
                Brand
                <input id="brand" name="brand" placeholder="heritage" />
              </label>
              <label>
                Available
                <select id="available-only" name="available_only">
                  <option value="true" selected>Only available</option>
                  <option value="false">Include unavailable</option>
                </select>
              </label>
              <label>
                Min price
                <input id="min-price" name="min_price" type="number" min="0" step="0.01" placeholder="0" />
              </label>
              <label>
                Max price
                <input id="max-price" name="max_price" type="number" min="0" step="0.01" placeholder="100" />
              </label>
              <label>
                Limit
                <input id="limit" name="limit" type="number" min="1" max="100" value="10" />
              </label>
              <label>
                Offset
                <input id="offset" name="offset" type="number" min="0" value="0" />
              </label>
            </div>
          </form>
          <div id="search-status" class="status" aria-live="polite"></div>
          <div id="results" class="results"></div>
        </div>

        <div class="panel detail-panel">
          <div class="panel-header">
            <h2>Product Detail</h2>
          </div>
          <div id="detail" class="detail empty">Select a product</div>
        </div>

        <div class="panel recommendations-panel">
          <div class="panel-header">
            <h2>Recommendations</h2>
            <button id="cart-recommendations" class="secondary" type="button">Cart recs</button>
          </div>
          <div id="recommendation-status" class="status" aria-live="polite"></div>
          <div id="recommendations" class="recommendations empty">View a product or create a cart</div>
        </div>

        <div class="panel cart-panel">
          <div class="panel-header">
            <h2>Cart Summary</h2>
            <span id="cart-id" class="cart-id">No cart</span>
          </div>
          <div id="cart-status" class="status" aria-live="polite"></div>
          <div id="cart" class="cart empty">Create a cart</div>
        </div>
      </section>
    </main>

    <script src="/ui/app.js"></script>
  </body>
</html>
